name: CI

on:
  # Pull request branches get CI through pull_request, so they no longer run twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
# Each run on main gets its own group, so runs on main are never
# cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install HawkEye
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: hawkeye@6.5.0
      - run: hawkeye check --config licenserc.toml

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commit_range="origin/$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$PUSH_BEFORE" HEAD; then
            commit_range="$PUSH_BEFORE..HEAD"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            commit_range="origin/main..HEAD"
            if [ "$(git rev-list --count "$commit_range")" -eq 0 ]; then
              echo "No new commits to check"
              exit 0
            fi
          fi
          pipx run gitlint --commits "$commit_range"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features

  # The caching machinery (fetch + fs2 advisory lock + cache-hit) is the
  # platform-sensitive part, so exercise it on every OS. Catalog freshness runs
  # on a schedule instead (freshness.yml).
  cache:
    name: cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test
      - name: Caching test (network)
        run: cargo test fetches_and_caches -- --ignored
